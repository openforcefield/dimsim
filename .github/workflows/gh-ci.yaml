name: GH Actions CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # nightly tests, between US and AUS working hours
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  # Specific group naming so CI is only cancelled
  # within same PR or on merge to main
  group: ${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}
  cancel-in-progress: true


defaults:
  run:
    shell: pixi run bash -e {0}

env:
  OE_LICENSE: ${{ github.workspace }}/oe_license.txt

jobs:
  main_tests:
    name: CI (${{ matrix.os }}, env ${{ matrix.environment }})
    runs-on: ${{ matrix.os }}
    strategy:
        fail-fast: true
        matrix:
          os: [macOS-latest, ubuntu-latest]
          environment:
            - py311
            - py311openeye
            - py312
            - py312openeye

    steps:
    - uses: actions/checkout@v6

    - name: Set up virtual environment
      uses: prefix-dev/setup-pixi@v0.9.5
      with:
        pixi-version: v0.66.0
        cache: true
        environments: ${{ matrix.environment }}

    - uses: ./.github/actions/include-openeye
      if: contains(matrix.environment, 'openeye')
      with:
        openeye-license-text: ${{ secrets.OE_LICENSE }}
        openeye-license-file: ${{ env.OE_LICENSE }}

    - name: Run type-checker
      run: pixi run -e ${{ matrix.environment }} run_mypy

    - name: Run tests
      run: pixi run -e ${{ matrix.environment }} run_tests

    - name: codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        verbose: True
