[workspace]
name = "dimsim"
channels = [ "conda-forge"]
platforms = [ "linux-64", "osx-arm64" ]

[tasks]
run_mypy = "python -m mypy -p 'dimsim'"
run_tests = "python -m pytest -v --cov=dimsim --cov-config=pyproject.toml --cov-append --cov-report=xml --color=yes dimsim/_tests"

[dependencies]
pydantic = "=2"
pyyaml = "*"
numpy = "*"
setuptools_scm = "*"
openff-toolkit = "0.18.*"
openff-interchange = "0.5.*"
openff-nagl-base = "*"
openff-nagl-models = "*"
openmm = "8.4.*"
openmmtools = "*"
rdkit = "2023.*"
sqlmodel = "*"
pytorch = "*"
smee = "*"
descent = "*"
dask = "*"
dask-jobqueue = "*"
dask-kubernetes = "*"
distributed = "*"

[pypi-dependencies]
rdkit-stubs = "*"
dimsim = { path = ".", editable = true }

[environments]
py311 = [ "py311", "test", "typing" ]
py311openeye = [ "py311", "openeye", "test", "typing" ]
py312 = [ "py312", "test", "typing" ]
py312openeye = [ "py312", "openeye", "test", "typing" ]
dev = [ "py312", "openeye", "test", "typing", "dev" ]

[feature.dev.dependencies]
pre-commit = "*"

[feature.openeye]
channels = [ "openeye", "conda-forge" ]
dependencies = { openeye-toolkits = "*" }

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
pytest-randomly = "*"

[feature.typing.dependencies]
mypy = "*"
types-PyYAML = "*"
types-requests = "*"
