[workspace]
name = "dimsim"
channels = [ "conda-forge"]
platforms = [ "linux-64", "osx-arm64" ]

[tasks]
run_mypy = "python -m mypy -p 'dimsim'"
run_tests = "python -m pytest -n logical --durations=10 --cov=dimsim --cov-config=pyproject.toml --cov-append --cov-report=xml --color=yes dimsim/_tests"

[pypi-dependencies]
dimsim = { path = ".", editable = true }
pydantic = "*"
pyyaml = "*"
numpy = "*"
polars = "*"
setuptools_scm = "*"
distributed = "*"
openmm = "==8.4.*"
sqlmodel = "*"
dask = "*"
dask-jobqueue = "*"
dask-kubernetes = "*"
rdkit-stubs = "*"
parsl = "*"
pyarrow = "==20.*"

[dependencies]
openmm = "8.4.*" # need to help Pixi, since conda solve constraints PyPI solve
openff-toolkit = "0.18.*"
openff-interchange = ">=0.5.2"
openff-nagl-base = "*"
openff-nagl-models = "*"
openmmtools = "*"
rdkit = "2023.*"
sqlmodel = "*"
pytorch = "*"
smee-base = "*"
descent = "*"
dask = "*"
dask-jobqueue = "*"
dask-kubernetes = "*"
distributed = "*"
# shim for upstream incompatibilities
# https://github.com/huggingface/datasets/issues/7742
# pyarrow <21 might also work
pyarrow = "<21"
datasets = ">=2.20"

[environments]
py312 = [ "py312", "test", "typing" ]
py312openeye = [ "py312", "openeye", "test", "typing" ]
dev = [ "py312", "openeye", "test", "typing", "dev" ]

[feature.dev.dependencies]
openff-packmol = "0.1.*"
packmol = "*"
openff-evaluator-base = "*"
pymol-open-source = "*"

[feature.dev.pypi-dependencies]
pre-commit = "*"
ruff = "*"
jupyterlab = "*"
red-molsim = "*"
ipython = "*"
ipdb = "*"

[feature.openeye]
channels = [ "openeye", "conda-forge" ]
dependencies = { openeye-toolkits = "*" }

[feature.py312.dependencies]
python = "3.12.*"

[feature.test.pypi-dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
pytest-randomly = "*"

[feature.typing.pypi-dependencies]
mypy = "*"
types-PyYAML = "*"
types-requests = "*"
